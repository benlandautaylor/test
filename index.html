<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penelope's Household</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
  :root {
    --ground: #191310;
    --panel: #221a15;
    --panel-edge: #3a2c21;
    --ink: #e8dcc4;
    --ink-dim: #a4937a;
    --terracotta: #c4622d;
    --terracotta-bright: #e07b3f;
    --ochre: #d9a441;
    --olive: #8a9a5b;
    --danger: #cf4e3c;
    --font-display: "Cinzel", "Times New Roman", serif;
    --font-body: "Alegreya", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }

  /* Meander (Greek key) border strip */
  .meander {
    height: 14px;
    background:
      repeating-linear-gradient(90deg,
        var(--terracotta) 0 2px, transparent 2px 8px,
        var(--terracotta) 8px 10px, transparent 10px 16px);
    border-top: 2px solid var(--terracotta);
    border-bottom: 2px solid var(--terracotta);
    opacity: 0.85;
    margin-bottom: 18px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--ochre);
    text-wrap: balance;
  }
  h1 .sub {
    display: block;
    font-family: var(--font-body);
    font-style: italic;
    font-weight: 400;
    font-size: 0.95rem;
    letter-spacing: 0;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .season-box { text-align: right; }
  .season-label {
    font-family: var(--font-display);
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: var(--ink);
  }
  .season-count { color: var(--ink-dim); font-size: 0.9rem; }
  .honor-line { font-size: 0.95rem; color: var(--ink-dim); }
  .honor-line b { color: var(--ochre); font-variant-numeric: tabular-nums; }

  button {
    font-family: var(--font-display);
    letter-spacing: 0.06em;
    cursor: pointer;
    border-radius: 3px;
  }
  button:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  .btn-end {
    background: var(--terracotta);
    color: #1a0f08;
    border: none;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 28px;
  }
  .btn-end:hover { background: var(--terracotta-bright); }
  .btn-end:disabled { background: var(--panel-edge); color: var(--ink-dim); cursor: default; }

  /* Resource bar */
  .resources {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .res {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 10px 14px;
  }
  .res .name {
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .res .amt {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .res .delta { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .delta.pos { color: var(--olive); }
  .delta.neg { color: var(--danger); }
  .delta.zero { color: var(--ink-dim); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 14px 16px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ochre);
    margin: 0 0 4px;
  }
  .panel .hint { color: var(--ink-dim); font-size: 0.88rem; font-style: italic; margin: 0 0 10px; }

  .job {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid var(--panel-edge);
  }
  .job:first-of-type { border-top: none; }
  .job .jname { flex: 1; }
  .job .jname b { font-weight: 700; }
  .job .jdesc { display: block; color: var(--ink-dim); font-size: 0.84rem; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 30px; height: 30px;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    font-size: 1.05rem;
    font-family: var(--font-body);
    line-height: 1;
  }
  .stepper button:hover:not(:disabled) { border-color: var(--terracotta); color: var(--terracotta-bright); }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper .count {
    min-width: 26px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .idle-note { margin-top: 8px; font-size: 0.88rem; color: var(--ink-dim); }
  .idle-note.warn { color: var(--danger); font-style: italic; }

  .upgrade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--panel-edge);
  }
  .upgrade:first-of-type { border-top: none; }
  .upgrade .udesc { display: block; color: var(--ink-dim); font-size: 0.84rem; }
  .upgrade button {
    background: var(--ground);
    color: var(--ochre);
    border: 1px solid var(--ochre);
    padding: 6px 12px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .upgrade button:hover:not(:disabled) { background: var(--ochre); color: #1a0f08; }
  .upgrade button:disabled { border-color: var(--panel-edge); color: var(--ink-dim); cursor: default; }
  .upgrade .owned {
    color: var(--olive);
    font-family: var(--font-display);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* ---------- suitor roster ---------- */
  .suitors-panel { grid-column: 1 / -1; }
  .roster-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .roster-head .table-note { color: var(--ink-dim); font-size: 0.88rem; font-style: italic; }
  .btn-feast {
    background: var(--ground);
    color: var(--ochre);
    border: 1px solid var(--ochre);
    padding: 8px 16px;
    font-size: 0.85rem;
  }
  .btn-feast:hover:not(:disabled) { background: var(--ochre); color: #1a0f08; }
  .btn-feast:disabled { border-color: var(--panel-edge); color: var(--ink-dim); cursor: default; }

  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
    gap: 10px;
  }
  .scard {
    background: var(--ground);
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .scard.dispersed { opacity: 0.4; }
  .scard.husband { border-color: var(--ochre); }
  .scard .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .sname { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--ink); }
  .sepithet { display: block; font-style: italic; color: var(--ink-dim); font-size: 0.8rem; }
  .chip {
    font-family: var(--font-display);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 9px;
    border: 1px solid;
    white-space: nowrap;
  }
  .chip.content   { color: var(--olive); border-color: var(--olive); }
  .chip.restless  { color: var(--ochre); border-color: var(--ochre); }
  .chip.aggressive{ color: var(--danger); border-color: var(--danger); }
  .chip.hostile   { color: var(--danger); border-color: var(--danger); background: rgba(207,78,60,0.12); }
  .chip.injured   { color: var(--ink-dim); border-color: var(--ink-dim); }
  .chip.gone      { color: var(--ink-dim); border-color: var(--panel-edge); }
  .chip.husband-chip { color: var(--ochre); border-color: var(--ochre); }
  .sstats { font-size: 0.8rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .straits { display: flex; gap: 4px; flex-wrap: wrap; }
  .trait-chip {
    font-size: 0.72rem;
    color: var(--ink-dim);
    border: 1px dotted var(--panel-edge);
    border-radius: 3px;
    padding: 1px 6px;
    cursor: help;
  }
  .exp-row { font-size: 0.78rem; color: var(--ink-dim); display: flex; justify-content: space-between; }
  .exp-row .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  .exp-bar { height: 6px; background: var(--panel-edge); border-radius: 3px; overflow: hidden; }
  .exp-fill { height: 100%; background: var(--ochre); }
  .exp-fill.low { background: var(--danger); }
  .mollify-row { font-size: 0.75rem; color: var(--ink-dim); letter-spacing: 0.1em; }
  .sbtns { display: flex; gap: 5px; margin-top: auto; flex-wrap: wrap; }
  .sbtns button {
    flex: 1;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    font-size: 0.68rem;
    padding: 5px 4px;
    letter-spacing: 0.04em;
  }
  .sbtns button:hover:not(:disabled) { border-color: var(--terracotta); color: var(--terracotta-bright); }
  .sbtns button:disabled { opacity: 0.4; cursor: default; }
  .sbtns .marry-btn { color: var(--ochre); }

  .chronicle { grid-column: 1 / -1; }
  .log {
    max-height: 230px;
    overflow-y: auto;
    font-size: 0.92rem;
    display: flex;
    flex-direction: column-reverse;
  }
  .log .entry { padding: 3px 0; border-top: 1px dotted var(--panel-edge); }
  .log .season-head {
    font-family: var(--font-display);
    letter-spacing: 0.08em;
    color: var(--ochre);
    font-size: 0.85rem;
  }
  .log .bad { color: var(--danger); }
  .log .good { color: var(--olive); }

  .endbar { display: flex; justify-content: center; margin: 18px 0 6px; }

  /* Overlays (endgame + demands) */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(12, 8, 5, 0.88);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .end-card {
    background: var(--panel);
    border: 2px solid var(--terracotta);
    border-radius: 4px;
    max-width: 560px;
    padding: 28px 32px;
    text-align: center;
  }
  .end-card h2 {
    font-family: var(--font-display);
    color: var(--ochre);
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    margin: 0 0 10px;
  }
  .end-card p { color: var(--ink); margin: 8px 0; }
  .end-card .score { font-size: 1.3rem; font-weight: 700; color: var(--terracotta-bright); font-variant-numeric: tabular-nums; }
  .end-card button {
    margin-top: 14px;
    background: var(--terracotta);
    color: #1a0f08;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .end-card button:hover { background: var(--terracotta-bright); }

  .demand-card { text-align: left; max-width: 520px; }
  .demand-card h2 { text-align: center; }
  .demand-card .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .demand-card .choices button {
    margin: 0;
    width: 100%;
    text-align: left;
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    font-family: var(--font-body);
    font-size: 0.92rem;
    padding: 10px 14px;
    letter-spacing: 0;
  }
  .demand-card .choices button:hover:not(:disabled) { border-color: var(--terracotta); background: var(--ground); }
  .demand-card .choices button:disabled { opacity: 0.4; cursor: default; }
  .demand-card .choices button.marry-choice { border-color: var(--ochre); color: var(--ochre); }

  /* Debug panel */
  .debug {
    margin-top: 20px;
    border: 1px dashed var(--panel-edge);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .debug summary { cursor: pointer; font-family: var(--font-display); letter-spacing: 0.08em; }
  .debug table { border-collapse: collapse; margin: 8px 0; }
  .debug td, .debug th { padding: 3px 8px; text-align: left; border-bottom: 1px dotted var(--panel-edge); }
  .debug input, .debug select {
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 3px;
    font-family: var(--font-body); font-size: 0.85rem; padding: 2px 5px; width: 60px;
  }
  .debug select { width: auto; }
  .debug button {
    background: var(--ground); color: var(--ink-dim);
    border: 1px solid var(--panel-edge); padding: 4px 10px; font-size: 0.75rem;
  }
  .debug button:hover { color: var(--ink); border-color: var(--ink-dim); }
  .debug .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meander" aria-hidden="true"></div>

  <header class="top">
    <h1>Penelope&rsquo;s Household
      <span class="sub">Odysseus is gone. The estate &mdash; and the suitors &mdash; remain.</span>
    </h1>
    <div class="season-box">
      <div class="season-label" id="seasonLabel"></div>
      <div class="season-count" id="seasonCount"></div>
      <div class="honor-line">Honor <b id="honorVal"></b> / 100</div>
    </div>
  </header>

  <section class="resources" id="resourceBar" aria-label="Stores"></section>

  <div class="grid">
    <section class="panel" aria-labelledby="menH">
      <h2 id="menH">Men of the Estate</h2>
      <p class="hint" id="menHint"></p>
      <div id="menJobs"></div>
      <p class="idle-note" id="menIdle"></p>
    </section>

    <section class="panel" aria-labelledby="womenH">
      <h2 id="womenH">Women of the Estate</h2>
      <p class="hint" id="womenHint"></p>
      <div id="womenJobs"></div>
      <p class="idle-note" id="womenIdle"></p>
    </section>

    <section class="panel suitors-panel" aria-labelledby="suitorH">
      <h2 id="suitorH">The Suitors</h2>
      <div class="roster-head">
        <span class="table-note" id="tableNote"></span>
        <button class="btn-feast" id="feastBtn"></button>
      </div>
      <div class="roster" id="roster"></div>
    </section>

    <section class="panel" aria-labelledby="upH">
      <h2 id="upH">Works &amp; Improvements</h2>
      <p class="hint">Spend wood and cloth to strengthen the estate.</p>
      <div id="upgradeList"></div>
    </section>

    <section class="panel" aria-labelledby="chronH">
      <h2 id="chronH">Chronicle</h2>
      <div class="log" id="log" role="log" aria-live="polite"></div>
    </section>
  </div>

  <div class="endbar">
    <button class="btn-end" id="endTurnBtn">End the Season</button>
  </div>

  <details class="debug" id="debugPanel">
    <summary>Debug &amp; playtest tools</summary>
    <div id="debugBody"></div>
  </details>

  <div class="meander" aria-hidden="true"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="end-card">
    <h2 id="endTitle"></h2>
    <div id="endBody"></div>
    <button id="restartBtn">Begin Again</button>
  </div>
</div>

<div class="overlay" id="demandOverlay" hidden>
  <div class="end-card demand-card">
    <h2 id="demandTitle"></h2>
    <div id="demandBody"></div>
    <div class="choices" id="demandChoices"></div>
  </div>
</div>

<script src="tuning.js"></script>
<script src="social.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Penelope's Household — household layer (milestone 1) plus the
 * social layer hooks (milestone 2, see social.js / tuning.js).
 * ------------------------------------------------------------------ */

const TH = TUNING.household;
const TOTAL_TURNS = TH.totalTurns;
const VALUE = TH.value;

const RES_META = [
  { key: "grain", name: "Grain" },
  { key: "sheep", name: "Sheep" },
  { key: "wood",  name: "Wood" },
  { key: "cloth", name: "Cloth" },
];

const MEN_JOBS = [
  { key: "farm",    name: "Farming",    desc: "grain for the household" },
  { key: "shepherd",name: "Shepherding",desc: "tend the flocks; herds grow" },
  { key: "lumber",  name: "Lumberyard", desc: "wood for improvements" },
];
const WOMEN_JOBS = [
  { key: "farm",  name: "Farming", desc: "grain for the household" },
  { key: "weave", name: "Weaving", desc: "cloth to wear and to spend" },
  { key: "serve", name: "Serving", desc: "keep the hall in order" },
];

const UPGRADES = [
  { key: "plows",   name: "Bronze Plows",   cost: { wood: 15 },            desc: "+1 grain per farmer" },
  { key: "terrace", name: "Terraced Fields",cost: { wood: 30, cloth: 8 },  desc: "+2 more grain per farmer" },
  { key: "fold",    name: "Stone Sheepfold",cost: { wood: 20 },            desc: "shepherds tend 12 sheep, strays halved" },
  { key: "loom",    name: "The Great Loom", cost: { wood: 12 },            desc: "+1 cloth per weaver" },
  { key: "granary", name: "Sealed Granary", cost: { wood: 25 },            desc: "grain spoilage halved" },
];

let S; // game state

function newGame() {
  S = {
    turn: 1,
    over: false,
    grain: 60, sheep: 30, wood: 12, cloth: 8,
    men: 10, women: 10,
    alloc: {
      men:   { farm: 6, shepherd: 3, lumber: 1 },
      women: { farm: 2, weave: 4, serve: 4 },
    },
    upgrades: {},
    disorder: false,   // hall was short of servants last season
    sickness: 0,       // workers laid up this season
    pendingDemand: null,
    demandPolicy: null, // set by fast-forward / headless sims to auto-answer demands
    log: [],
  };
  Social.init(S);
  log(`Ten years have passed since Odysseus sailed for Troy. Five suitors — ${S.cast.map(su => su.name).join(", ")} — have taken seats in your hall, each with his own retinue, and none intends to leave.`, "season-head");
  render();
}

/* ---------- derived numbers ---------- */

function seasonName(turn) {
  const year = Math.ceil(turn / 2);
  return `${turn % 2 === 1 ? "Spring" : "Autumn"}, Year ${year}`;
}

function grainPerFarmer() {
  let g = TH.farmerGrainBase;
  if (S.upgrades.plows) g += 1;
  if (S.upgrades.terrace) g += 2;
  return g;
}
function clothPerWeaver() { return TH.clothPerWeaverBase + (S.upgrades.loom ? 1 : 0); }
function woodPerLumber()  { return TH.woodPerLumber; }
function shepherdCapacity() { return S.upgrades.fold ? TH.shepherdCapacityFold : TH.shepherdCapacityBase; }
function strayRate() { return S.upgrades.fold ? TH.strayRateFold : TH.strayRateBase; }
function spoilRate() { return S.upgrades.granary ? TH.grainSpoilRate / 2 : TH.grainSpoilRate; }

function servantsNeeded() {
  return TH.servantsBase
    + Math.floor(Social.headcount(S) / TH.servantsPerHeads)
    + Social.extraServantsNeeded(S);
}
function householdMouths() { return S.men + S.women + TH.familyMouths; }

function assigned(group) {
  return Object.values(S.alloc[group]).reduce((a, b) => a + b, 0);
}
function idle(group) {
  return (group === "men" ? S.men : S.women) - assigned(group);
}

function productionMultiplier() {
  let m = 1;
  if (S.disorder) m -= TH.disorderPenalty;
  return m;
}

// Forecast for the resource bar. Sheep growth uses expected values.
function forecast() {
  const mult = productionMultiplier();
  const harvest = S.turn % 2 === 0 ? TH.autumnHarvestMult : 1;
  const farmers = S.alloc.men.farm + S.alloc.women.farm;
  const grainIn = Math.round(farmers * grainPerFarmer() * harvest * mult);
  const woodIn  = Math.round(S.alloc.men.lumber * woodPerLumber() * mult);
  const clothIn = Math.round(S.alloc.women.weave * clothPerWeaver() * mult);

  const tended = Math.min(S.sheep, S.alloc.men.shepherd * shepherdCapacity());
  const strays = Math.round((S.sheep - tended) * strayRate());
  const lambs = Math.round(tended * TH.lambRate);

  const grainOut = householdMouths() * TH.grainPerMouth + Social.tableGrainDemand(S)
    + Math.round(S.grain * spoilRate());

  return {
    grain: grainIn - grainOut,
    sheep: lambs - strays - Social.tableSheepDemand(S),
    wood: woodIn,
    cloth: clothIn - TH.clothWear,
  };
}

/* ---------- season resolution ---------- */

// Take goods worth `value` from the stores, richest first.
// Returns a readable description of what was taken.
function seizeGoods(value) {
  let toSeize = value;
  const seized = [];
  for (const key of ["cloth", "wood", "sheep", "grain"]) {
    if (toSeize <= 0) break;
    const take = Math.min(S[key], Math.ceil(toSeize / VALUE[key]));
    if (take > 0) {
      S[key] -= take;
      toSeize -= take * VALUE[key];
      seized.push(`${take} ${key}`);
    }
  }
  return seized.join(", ");
}

// Entry point for the End Season button. A fulfillment demand may
// interpose a modal; the season resolves after the player answers.
function endSeason() {
  if (S.over || S.pendingDemand) return;
  const su = Social.pickDemand(S);
  if (su) {
    if (S.demandPolicy) {
      Social.respondToDemand(S, su, S.demandPolicy(S, su));
    } else {
      S.pendingDemand = su.key;
      showDemandModal(su);
      render();
      return;
    }
  }
  resolveSeason();
}

function resolveSeason() {
  log(`— ${seasonName(S.turn)} draws to a close —`, "season-head");

  // Sickness from last season's event recovers
  if (S.sickness > 0) {
    log(`${S.sickness} of the household recover from fever and return to work.`);
    S.sickness = 0;
  }

  const mult = productionMultiplier();
  if (S.disorder) log(`With too few hands serving the hall, the whole estate worked poorly this season (−${Math.round(TH.disorderPenalty * 100)}% production).`, "bad");

  // Random event (may modify this season's production)
  let eventGrainMult = 1;
  const roll = Math.random();
  if (roll < 0.08) {
    eventGrainMult = 1.25;
    log("Demeter smiles: the fields yield a quarter more than hoped.", "good");
  } else if (roll < 0.16) {
    const lost = Math.max(1, Math.round(S.sheep * (S.upgrades.fold ? 0.05 : 0.10)));
    S.sheep = Math.max(0, S.sheep - lost);
    log(`Wolves come down from the hills by night. ${lost} sheep are lost.`, "bad");
  } else if (roll < 0.22) {
    const repair = Math.min(S.wood, 8);
    S.wood -= repair;
    log(`A storm off the sea tears at the roofs. Repairs cost ${repair} wood.`, "bad");
  } else if (roll < 0.28) {
    S.cloth += 6;
    log("Phoenician traders put in at the harbor and pay tribute in fine cloth (+6 cloth).", "good");
  } else if (roll < 0.34) {
    S.sickness = 2;
    log("Fever passes through the servants' quarters. 2 workers will be laid up next season.", "bad");
  }

  // --- Production ---
  const harvest = S.turn % 2 === 0 ? TH.autumnHarvestMult : 1;
  const farmers = S.alloc.men.farm + S.alloc.women.farm;
  const grainIn = Math.round(farmers * grainPerFarmer() * harvest * eventGrainMult * mult);
  const woodIn  = Math.round(S.alloc.men.lumber * woodPerLumber() * mult);
  const clothIn = Math.round(S.alloc.women.weave * clothPerWeaver() * mult);
  S.grain += grainIn;
  S.wood += woodIn;
  S.cloth += clothIn;

  const tended = Math.min(S.sheep, S.alloc.men.shepherd * shepherdCapacity());
  const strays = Math.round((S.sheep - tended) * strayRate());
  const lambs = Math.round(tended * TH.lambRate);
  S.sheep += lambs - strays;

  const bits = [`Harvest: +${grainIn} grain`];
  if (woodIn) bits.push(`+${woodIn} wood`);
  if (clothIn) bits.push(`+${clothIn} cloth`);
  if (lambs) bits.push(`+${lambs} lambs`);
  log(bits.join(", ") + ".");
  if (strays > 0) log(`${strays} untended sheep strayed into the hills.`, "bad");

  // --- Wealthy suitors may send gifts ---
  Social.wealthyGifts(S);

  // --- Suitors' table (they help themselves) ---
  const heads = Social.headcount(S);
  if (heads > 0) {
    let shortfallValue = 0;
    const gWant = Social.tableGrainDemand(S);
    const sWant = Social.tableSheepDemand(S);
    const gTaken = Math.min(S.grain, gWant);
    const sTaken = Math.min(S.sheep, sWant);
    S.grain -= gTaken;
    S.sheep -= sTaken;
    shortfallValue += (gWant - gTaken) * VALUE.grain + (sWant - sTaken) * VALUE.sheep;
    log(`The suitors and their hangers-on — ${heads} mouths — feast: ${gTaken} grain and ${sTaken} sheep go to their tables.`);

    if (shortfallValue > 0) {
      const seized = seizeGoods(shortfallValue * 2);
      log(`The feast ran short! Enraged, the suitors ransack the storerooms and carry off ${seized || "what little remains"}.`, "bad");
    }
  }

  // --- Household eats ---
  let need = householdMouths() * TH.grainPerMouth;
  const grainEaten = Math.min(S.grain, need);
  S.grain -= grainEaten;
  need -= grainEaten;
  if (need > 0) {
    const slaughter = Math.min(S.sheep, Math.ceil(need / TH.sheepFoodValue));
    if (slaughter > 0) {
      S.sheep -= slaughter;
      need -= slaughter * TH.sheepFoodValue;
      log(`Grain ran out — ${slaughter} sheep were slaughtered to feed the household.`, "bad");
    }
  }
  if (need > 0) {
    // Hunger: staff slip away in the night
    const fleeing = Math.min(Math.max(1, Math.ceil(need / TH.fleePerUnfed)), S.men + S.women);
    for (let i = 0; i < fleeing; i++) {
      if (S.men >= S.women && S.men > 0) S.men--; else S.women--;
    }
    clampAllocations();
    log(`There was not food enough for every mouth. ${fleeing} of your people abandon the estate in hunger.`, "bad");
    if (S.men + S.women <= TH.collapseStaff) {
      return endGame({ victory: false, title: "The Estate Falls",
        html: `<p>The household has scattered. With no hands left to work the land, the estate of Odysseus collapses into ruin, and the suitors pick it clean.</p>` });
    }
  }

  // --- Cloth wears out ---
  S.cloth = Math.max(0, S.cloth - TH.clothWear);

  // --- Spoilage ---
  const spoiled = Math.round(S.grain * spoilRate());
  if (spoiled > 0) {
    S.grain -= spoiled;
    log(`${spoiled} grain spoiled in the stores.`);
  }

  // --- Social layer season end: decay, restlessness, aggression, plots ---
  const lost = Social.resolveSeasonEnd(S, seizeGoods);
  if (lost) {
    return endGame({ victory: false, title: "Telemachos Slain", html: `<p>${lost}</p>` });
  }

  // --- Hall order for next season ---
  const serveShort = servantsNeeded() - Math.min(S.alloc.women.serve, S.women);
  S.disorder = serveShort > 0;
  if (S.disorder) log(`The hall wants ${serveShort} more serving women. Disorder will hamper next season's work.`, "bad");

  // --- Advance ---
  S.turn++;
  if (S.turn > TOTAL_TURNS) {
    return endGame(Social.endgame(S));
  }
  render();
}

function clampAllocations() {
  for (const group of ["men", "women"]) {
    const total = group === "men" ? S.men : S.women;
    const jobs = Object.keys(S.alloc[group]);
    let over = assigned(group) - total;
    for (const j of jobs.slice().reverse()) {
      while (over > 0 && S.alloc[group][j] > 0) { S.alloc[group][j]--; over--; }
    }
  }
}

function wealth() {
  return S.grain * VALUE.grain + S.sheep * VALUE.sheep
       + S.wood * VALUE.wood + S.cloth * VALUE.cloth
       + (S.men + S.women) * TH.staffWealth;
}

function endGame(outcome) {
  S.over = true;
  S.outcome = outcome;
  const overlay = document.getElementById("overlay");
  document.getElementById("endTitle").textContent = outcome.title;
  let html = outcome.html;
  if (outcome.victory) {
    html += `<p>Final wealth of the estate: <span class="score">${wealth()}</span></p>`;
  } else {
    html += `<p><em>Survived ${Math.min(S.turn, TOTAL_TURNS)} of ${TOTAL_TURNS} seasons.</em></p>`;
  }
  document.getElementById("endBody").innerHTML = html;
  overlay.hidden = false;
  render();
}

/* ---------- rendering ---------- */

function log(msg, cls) {
  S.log.push({ msg, cls: cls || "" });
  const el = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "entry" + (cls ? " " + cls : "");
  div.textContent = msg;
  el.prepend(div);
}

function fmtDelta(n) {
  const cls = n > 0 ? "pos" : n < 0 ? "neg" : "zero";
  const sign = n > 0 ? "+" : "";
  return `<span class="delta ${cls}">${sign}${n} next season</span>`;
}

function stateChip(su) {
  if (S.married && S.married.key === su.key) return `<span class="chip husband-chip">Husband</span>`;
  if (su.dispersed) return `<span class="chip gone">Departed</span>`;
  if (su.injuredSeasons > 0) return `<span class="chip injured">Injured</span>`;
  if (su.hostile) return `<span class="chip hostile">Hostile</span>`;
  return `<span class="chip ${su.state}">${su.state[0].toUpperCase() + su.state.slice(1)}</span>`;
}

function render() {
  document.getElementById("seasonLabel").textContent = S.over && S.turn > TOTAL_TURNS
    ? "The Tale Ends" : seasonName(Math.min(S.turn, TOTAL_TURNS));
  document.getElementById("seasonCount").textContent =
    `Season ${Math.min(S.turn, TOTAL_TURNS)} of ${TOTAL_TURNS}`;
  document.getElementById("honorVal").textContent = S.honor;

  const f = forecast();
  document.getElementById("resourceBar").innerHTML = RES_META.map(r => `
    <div class="res">
      <div class="name">${r.name}</div>
      <div class="amt">${S[r.key]}</div>
      <div>${fmtDelta(f[r.key])}</div>
    </div>`).join("");

  renderJobs("men", MEN_JOBS, "menJobs");
  renderJobs("women", WOMEN_JOBS, "womenJobs");

  document.getElementById("menHint").textContent =
    `${S.men} men. Each farmer: ${grainPerFarmer()} grain (×${TH.autumnHarvestMult} in autumn). Each shepherd tends ${shepherdCapacity()} sheep. Each woodsman: ${woodPerLumber()} wood.`;
  document.getElementById("womenHint").textContent =
    `${S.women} women. Each farmer: ${grainPerFarmer()} grain. Each weaver: ${clothPerWeaver()} cloth. The hall needs ${servantsNeeded()} serving.`;

  const mi = idle("men"), wi = idle("women");
  document.getElementById("menIdle").textContent = mi > 0 ? `${mi} men stand idle.` : "All men are at work.";
  const serveShort = servantsNeeded() - S.alloc.women.serve;
  const wIdleEl = document.getElementById("womenIdle");
  if (serveShort > 0) {
    wIdleEl.textContent = `Short ${serveShort} serving women — the hall will fall into disorder!`;
    wIdleEl.className = "idle-note warn";
  } else {
    wIdleEl.textContent = wi > 0 ? `${wi} women stand idle.` : "All women are at work.";
    wIdleEl.className = "idle-note";
  }

  renderSuitors();
  renderUpgrades();
  renderDebug();

  document.getElementById("endTurnBtn").disabled = S.over || !!S.pendingDemand;
}

function renderSuitors() {
  const heads = Social.headcount(S);
  const note = document.getElementById("tableNote");
  if (S.married) {
    note.textContent = "The hall is quiet. Your husband's household and yours are one.";
  } else {
    note.textContent = `${heads} mouths at your table each season (${Social.active(S).length} suitors, each with ${1 + Social.retinueSize(S)} in his party): ${Social.tableGrainDemand(S)} grain, ${Social.tableSheepDemand(S)} sheep — taken, not asked for.`;
  }

  const feastBtn = document.getElementById("feastBtn");
  const fc = Social.feastCost(S);
  const canFeast = !S.married && !S.over && !S.feastedThisSeason && S.grain >= fc.grain && S.sheep >= fc.sheep;
  feastBtn.textContent = S.feastedThisSeason
    ? "Feast held this season"
    : `Hold a Feast (${fc.grain} grain, ${fc.sheep} sheep)`;
  feastBtn.disabled = !canFeast;
  feastBtn.hidden = !!S.married;

  const gc = TUNING.gift.cost;
  document.getElementById("roster").innerHTML = S.cast.map(su => {
    const isHusband = S.married && S.married.key === su.key;
    const gone = su.dispersed && !isHusband;
    const expClass = su.expectation < 30 ? "exp-fill low" : "exp-fill";
    const canAct = !S.over && !S.married && !su.dispersed;
    const canGift = canAct && S.cloth >= gc.cloth && S.sheep >= gc.sheep;
    const pips = "●".repeat(Math.min(su.mollify, 8)) + (su.mollify > 8 ? "+" : "");
    return `<div class="scard${gone ? " dispersed" : ""}${isHusband ? " husband" : ""}">
      <div class="top-row">
        <span class="sname">${su.name}<span class="sepithet">${su.epithet}</span></span>
        ${stateChip(su)}
      </div>
      <div class="sstats">Charisma ${su.charisma} · Steward ${su.stewardship} · Martial ${su.martial}</div>
      <div class="straits">${su.traits.map(t =>
        `<span class="trait-chip" title="${Social.TRAITS[t].blurb}">${Social.TRAITS[t].name}</span>`).join("")}</div>
      <div class="exp-row"><span>Expectation</span><span class="v">${su.expectation}</span></div>
      <div class="exp-bar"><div class="${expClass}" style="width:${su.expectation}%"></div></div>
      <div class="mollify-row">Bought off: ${su.mollify === 0 ? "never" : pips}${su.activePromises > 0 ? ` · ${su.activePromises} promise${su.activePromises > 1 ? "s" : ""} live` : ""}</div>
      ${gone || isHusband ? "" : `<div class="sbtns">
        <button data-gift="${su.key}" ${canGift ? "" : "disabled"} title="Costs ${gc.cloth} cloth, ${gc.sheep} sheep. Public — the others grow jealous.">Gift</button>
        <button data-promise="${su.key}" ${canAct ? "" : "disabled"} title="Free and private — but promises can surface and cost Honor.">Promise</button>
        <button class="marry-btn" data-marry="${su.key}" ${canAct ? "" : "disabled"} title="End the courtship. The other suitors disperse.">Marry</button>
      </div>`}
    </div>`;
  }).join("");
}

function renderUpgrades() {
  document.getElementById("upgradeList").innerHTML = UPGRADES.map(u => {
    const costTxt = Object.entries(u.cost).map(([k, v]) => `${v} ${k}`).join(" + ");
    const afford = Object.entries(u.cost).every(([k, v]) => S[k] >= v);
    const right = S.upgrades[u.key]
      ? `<span class="owned">Built</span>`
      : `<button data-upgrade="${u.key}" ${afford && !S.over ? "" : "disabled"}>${costTxt}</button>`;
    return `<div class="upgrade">
      <div><b>${u.name}</b><span class="udesc">${u.desc}</span></div>${right}
    </div>`;
  }).join("");
}

function renderJobs(group, jobs, elId) {
  const el = document.getElementById(elId);
  el.innerHTML = jobs.map(j => `
    <div class="job">
      <div class="jname"><b>${j.name}</b><span class="jdesc">${j.desc}</span></div>
      <div class="stepper">
        <button data-group="${group}" data-job="${j.key}" data-dir="-1" aria-label="Fewer at ${j.name}" ${S.alloc[group][j.key] <= 0 || S.over ? "disabled" : ""}>−</button>
        <span class="count">${S.alloc[group][j.key]}</span>
        <button data-group="${group}" data-job="${j.key}" data-dir="1" aria-label="More at ${j.name}" ${idle(group) <= 0 || S.over ? "disabled" : ""}>+</button>
      </div>
    </div>`).join("");
}

/* ---------- demand modal ---------- */

function showDemandModal(su) {
  const d = Social.demandText(S, su);
  document.getElementById("demandTitle").textContent = d.title;
  document.getElementById("demandBody").innerHTML = `<p>${d.body}</p>`;
  document.getElementById("demandChoices").innerHTML = `
    <button data-demand-choice="pay" ${d.pay.disabled ? "disabled" : ""}>${d.pay.label}</button>
    <button data-demand-choice="repromise">${d.repromise.label}</button>
    <button data-demand-choice="refuse">${d.refuse.label}</button>
    <button data-demand-choice="marry" class="marry-choice">${d.marry.label}</button>`;
  document.getElementById("demandOverlay").hidden = false;
}

function answerDemand(choice) {
  const su = Social.byKey(S, S.pendingDemand);
  S.pendingDemand = null;
  document.getElementById("demandOverlay").hidden = true;
  Social.respondToDemand(S, su, choice);
  if (!S.over) resolveSeason();
}

/* ---------- marriage confirm (main-turn action) ---------- */

function showMarryConfirm(key) {
  const su = Social.byKey(S, key);
  document.getElementById("demandTitle").textContent = `Wed ${su.name}?`;
  document.getElementById("demandBody").innerHTML =
    `<p>${su.name}, ${su.epithet} — ${su.traits.map(t => Social.TRAITS[t].name.toLowerCase()).join(" and ")}. The moment you accept, the other suitors disperse and the household pressure lifts. But your son's safety will rest on the man you have chosen, on your honor as it stands today, and on how often you strung <em>him</em> along.</p>`;
  document.getElementById("demandChoices").innerHTML = `
    <button data-marry-confirm="${su.key}" class="marry-choice">Accept his suit</button>
    <button data-marry-cancel="1">Keep him waiting</button>`;
  document.getElementById("demandOverlay").hidden = false;
}

/* ---------- debug & playtest tools ---------- */

function renderDebug() {
  const el = document.getElementById("debugBody");
  if (!document.getElementById("debugPanel").open) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="row">
      <label>Honor <input type="number" id="dbgHonor" value="${S.honor}" min="0" max="100"></label>
      <span>Odysseus ${S.odysseusReturns ? "WILL return" : "will NOT return"} (rolled at start)</span>
      <span>Missed feasts: ${S.missedFeasts} · Plot armed: ${S.plotArmed || "no"}</span>
    </div>
    <table><tr><th>Suitor</th><th>Expectation</th><th>State</th><th>Mollify</th><th>Promises</th></tr>
    ${S.cast.map((su, i) => `<tr>
      <td>${su.name}${su.dispersed ? " (gone)" : ""}${su.hostile ? " ☠" : ""}</td>
      <td><input type="number" data-dbg-exp="${i}" value="${su.expectation}" min="0" max="100"></td>
      <td><select data-dbg-state="${i}">
        ${["content", "restless"].map(s => `<option value="${s}" ${su.state === s ? "selected" : ""}>${s}</option>`).join("")}
      </select></td>
      <td><input type="number" data-dbg-mol="${i}" value="${su.mollify}" min="0"></td>
      <td>${su.activePromises}</td>
    </tr>`).join("")}</table>
    <div class="row">
      <button id="dbgFf1">Auto-resolve 1 season</button>
      <button id="dbgFfEnd">Auto-resolve to game end</button>
      <span>(defaults: feast when affordable; demands — pay if affordable, else refuse)</span>
    </div>`;
}

function defaultDemandPolicy(state, su) {
  return Social.payCost(state, su).affordable ? "pay" : "refuse";
}

function fastForward(seasons) {
  S.demandPolicy = defaultDemandPolicy;
  for (let i = 0; i < seasons && !S.over; i++) {
    Social.feast(S);
    endSeason();
  }
  S.demandPolicy = null;
  render();
}

window.PENELOPE = { get S() { return S; }, TUNING, Social,
  set: (key, value) => { S[key] = value; render(); } };

/* ---------- input ---------- */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.id === "restartBtn") {
    document.getElementById("overlay").hidden = true;
    document.getElementById("log").innerHTML = "";
    newGame();
    return;
  }
  if (S.over) return;

  if (btn.dataset.group) {
    const { group, job } = btn.dataset;
    const dir = parseInt(btn.dataset.dir, 10);
    if (dir < 0 && S.alloc[group][job] > 0) S.alloc[group][job]--;
    if (dir > 0 && idle(group) > 0) S.alloc[group][job]++;
    render();
  } else if (btn.dataset.upgrade) {
    const u = UPGRADES.find(x => x.key === btn.dataset.upgrade);
    if (!u || S.upgrades[u.key]) return;
    if (!Object.entries(u.cost).every(([k, v]) => S[k] >= v)) return;
    for (const [k, v] of Object.entries(u.cost)) S[k] -= v;
    S.upgrades[u.key] = true;
    log(`${u.name} — built. ${u.desc}.`, "good");
    render();
  } else if (btn.id === "feastBtn") {
    Social.feast(S);
    render();
  } else if (btn.dataset.gift) {
    Social.gift(S, btn.dataset.gift);
    render();
  } else if (btn.dataset.promise) {
    Social.promise(S, btn.dataset.promise);
    render();
  } else if (btn.dataset.marry) {
    showMarryConfirm(btn.dataset.marry);
  } else if (btn.dataset.marryConfirm) {
    document.getElementById("demandOverlay").hidden = true;
    Social.marry(S, btn.dataset.marryConfirm);
    render();
  } else if (btn.dataset.marryCancel) {
    document.getElementById("demandOverlay").hidden = true;
  } else if (btn.dataset.demandChoice) {
    answerDemand(btn.dataset.demandChoice);
  } else if (btn.id === "endTurnBtn") {
    endSeason();
  } else if (btn.id === "dbgFf1") {
    fastForward(1);
  } else if (btn.id === "dbgFfEnd") {
    fastForward(TOTAL_TURNS);
  }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "dbgHonor") { S.honor = Math.max(0, Math.min(100, +t.value || 0)); render(); }
  else if (t.dataset.dbgExp != null) { S.cast[+t.dataset.dbgExp].expectation = Math.max(0, Math.min(100, +t.value || 0)); render(); }
  else if (t.dataset.dbgState != null) { S.cast[+t.dataset.dbgState].state = t.value; render(); }
  else if (t.dataset.dbgMol != null) { S.cast[+t.dataset.dbgMol].mollify = Math.max(0, +t.value || 0); render(); }
});

document.getElementById("debugPanel").addEventListener("toggle", renderDebug);
document.addEventListener("keydown", (e) => {
  if (e.key === "`") {
    const p = document.getElementById("debugPanel");
    p.open = !p.open;
  }
});

newGame();
</script>
